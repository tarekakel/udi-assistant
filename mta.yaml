_schema-version: "3.3"
ID: udi-assistant
version: 0.1.0
description: GxP-flavoured UDI master-data service with audit trail, XSUAA security, RAG assistant and MCP

parameters:
  enable-parallel-deployments: true

modules:
  # ---- Spring Boot service -------------------------------------------------------------------
  - name: udi-assistant-srv
    type: java
    path: srv
    parameters:
      buildpack: java_buildpack
      memory: 1024M
      disk-quota: 1024M      # JRE + ~140 MB jar (Spring AI); 512 MB is too tight
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
      # The buildpack's auto-configuration frameworks are switched off: java-cfenv bundles a Micrometer
      # class that clashes with Spring Boot 4, and Spring Auto Reconfiguration is deprecated. Bindings
      # are read explicitly by the application instead (see DECISIONS.md).
      JBP_CONFIG_JAVA_CF_ENV: '{ enabled: false }'
      JBP_CONFIG_SPRING_AUTO_RECONFIGURATION: '{ enabled: false }'
    build-parameters:
      builder: maven                          # runs `mvn -B package`; needs Maven 3.9+ on the PATH
      build-result: target/udi-assistant-*.jar
    requires:
      - name: udi-assistant-uaa
      - name: openai
      - name: udi-assistant-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ---- Application router: login, scope checks at the edge, token forwarding ----------------
  - name: udi-assistant-approuter
    type: nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 256M
    properties:
      SESSION_TIMEOUT: 60          # minutes of inactivity before re-login; default 15 is short for a demo
    build-parameters:
      # the SAPUI5 client is built first and copied into the router's static resources
      requires:
        - name: udi-assistant-ui5
          artifacts:
            - "./*"
          target-path: resources/ui5/
    requires:
      - name: udi-assistant-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # SAPUI5 (TypeScript) client: built by the MTA build and served by the approuter from resources/ui5
  - name: udi-assistant-ui5
    type: html5
    path: ui5
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
      build-result: dist
      supported-platforms: []

resources:
  # OpenAI key for the regulation assistant, created once by hand and never stored in this file:
  #   cf cups openai -p '{"apiKey":"sk-..."}'
  # Optional: without it the service starts and the assistant endpoints answer 503.
  - name: openai
    type: org.cloudfoundry.existing-service
    optional: true

  # SAP HANA Cloud schema (needs a running HANA Cloud instance mapped to this space; free tier on trial).
  # Optional: when it cannot be created the service starts on in-memory H2 instead (the binding decides).
  - name: udi-assistant-db
    type: org.cloudfoundry.managed-service
    optional: true
    parameters:
      service: hana
      service-plan: hdi-shared

  # One XSUAA instance shared by router and service; scopes and roles come from xs-security.json.
  - name: udi-assistant-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
