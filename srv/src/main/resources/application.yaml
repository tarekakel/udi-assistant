spring:
  application:
    name: udi-assistant
  # Local secrets live in .env (git-ignored). On BTP the same keys arrive as environment variables.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:udi;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only checks it matches the entities
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      # Local development: serve the same UI the approuter serves on BTP (folder is absent in the cloud droplet)
      static-locations: classpath:/static/, file:../approuter/resources/
  ai:
    openai:
      # Resolved from app.openai.api-key; when that is blank, AssistantKeyEnvironmentPostProcessor installs a placeholder
      api-key: ${app.openai.api-key}
      chat:
        options:
          model: ${app.openai.model}
          temperature: 0.1
      embedding:
        options:
          model: ${app.openai.embedding-model}

    mcp:
      server:
        name: udi-assistant
        version: 0.1.0
        # No server-side session: each request is self-contained, so the service can restart or scale out freely
        protocol: STATELESS
        instructions: >-
          Read-only tools over UDI device master data (findDevice, searchDevices), its audit trail
          (getAuditTrail) and the regulation excerpts the assistant is grounded in (searchRegulation).
          Master data is changed by people through the application, never by tools.
        capabilities:
          resource: false
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  seed-data: true
  openai:
    # .env locally; on BTP a user-provided service named "openai" with {"apiKey": "..."} bound to the app
    api-key: ${OPENAI_API_KEY:${vcap.services.openai.credentials.apiKey:}}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding-model: text-embedding-3-small
  assistant:
    top-k: 4
    similarity-threshold: 0.25
  security:
    xsuaa:
      # Filled from the bound XSUAA instance on Cloud Foundry (VCAP_SERVICES -> vcap.services.* properties).
      # Empty locally, where the default profile runs without OAuth.
      url: ${vcap.services.udi-assistant-uaa.credentials.url:}
      xsappname: ${vcap.services.udi-assistant-uaa.credentials.xsappname:}
      client-id: ${vcap.services.udi-assistant-uaa.credentials.clientid:}

---
# Cloud Foundry: JWT security on, developer conveniences off.
spring:
  config:
    activate:
      on-profile: cloud
  h2:
    console:
      enabled: false
