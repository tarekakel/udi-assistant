# Test defaults (higher precedence than application.yaml, lower than @SpringBootTest properties).

# Each test context gets its own in-memory database; Flyway migrates it. Otherwise contexts with different
# properties share one H2 instance and seeded data from one test collides with another.
spring.datasource.url=jdbc:h2:mem:test${random.int[100000,999999]};DB_CLOSE_DELAY=-1

# Tests never call OpenAI: the assistant stays unconfigured unless a test sets app.openai.api-key itself,
# and then it must also stub ChatModel / RegulationIndex.
app.openai.api-key=
